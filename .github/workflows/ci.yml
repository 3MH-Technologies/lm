name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Syntax check (compile all Python files)
        run: |
          python -m py_compile browser_agent.py tools/*.py
          echo "::notice::All Python files compile OK"

      - name: CLI smoke test — help commands
        run: |
          python tools/all_in_one.py help
          python tools/arena_api.py help
          python tools/agent_api.py help
          python tools/hub_api.py help
          python tools/mail_api.py help
          python tools/account_creator.py --help